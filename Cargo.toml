[package]
name = "abner"
version = "0.1.0"
edition = "2024"
description = "A/B video comparison player — play N videos in sync, flip between them."

[package.metadata.abner-host]
api = "crates/processor-api"
version = 2

[dependencies]
abner-processor-api = { path = "crates/processor-api" }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
winit = "0.30"
wgpu = "30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
ab_glyph = "0.2"
serde_json = "1"
# The config file (src/config.rs): abner.default.toml overlaid by a user file.
serde = { version = "1", features = ["derive"] }
toml = "1.1"
# The launch window draws the wordmark from assets/logo/logo-01.png, which the
# renderer uploads as a texture — unlike the Dock icon (decoded by AppKit, see
# main.rs) it needs an RGBA buffer in-process, and nothing else can produce one.
png = "0.18"
# FilmCraft's pure-Rust demuxers and decoders with its VideoToolbox path (H.264, HEVC, VP9,
# AV1 on Apple silicon; `filmcraft-platform` holds the OS FFI). Same pin as switchblade: a fork
# revision carrying the VP9 (storytold/filmcraft#2180) and AV1 (#2608) VideoToolbox decoders
# until they merge upstream. Metadata, playback, thumbnails and waveforms run
# in-process; FFprobe remains for timeline packet metadata in other containers.
filmcraft-codecs = { git = "https://github.com/monomadic/filmcraft", rev = "3be5ba26da4578cc973eb8f0ab070df1bda9a1f6" }
filmcraft-media = { git = "https://github.com/monomadic/filmcraft", rev = "3be5ba26da4578cc973eb8f0ab070df1bda9a1f6" }
filmcraft-frame = { git = "https://github.com/monomadic/filmcraft", rev = "3be5ba26da4578cc973eb8f0ab070df1bda9a1f6" }
filmcraft-color = { git = "https://github.com/monomadic/filmcraft", rev = "3be5ba26da4578cc973eb8f0ab070df1bda9a1f6" }
filmcraft-time = { git = "https://github.com/monomadic/filmcraft", rev = "3be5ba26da4578cc973eb8f0ab070df1bda9a1f6" }
filmcraft-isobmff = { git = "https://github.com/monomadic/filmcraft", rev = "3be5ba26da4578cc973eb8f0ab070df1bda9a1f6" }
filmcraft-matroska = { git = "https://github.com/monomadic/filmcraft", rev = "3be5ba26da4578cc973eb8f0ab070df1bda9a1f6" }
filmcraft-h264 = { git = "https://github.com/monomadic/filmcraft", rev = "3be5ba26da4578cc973eb8f0ab070df1bda9a1f6" }
filmcraft-hevc = { git = "https://github.com/monomadic/filmcraft", rev = "3be5ba26da4578cc973eb8f0ab070df1bda9a1f6" }
filmcraft-av1 = { git = "https://github.com/monomadic/filmcraft", rev = "3be5ba26da4578cc973eb8f0ab070df1bda9a1f6" }
filmcraft-bitstream = { git = "https://github.com/monomadic/filmcraft", rev = "3be5ba26da4578cc973eb8f0ab070df1bda9a1f6" }
filmcraft-export = { git = "https://github.com/monomadic/filmcraft", rev = "3be5ba26da4578cc973eb8f0ab070df1bda9a1f6" }
filmcraft-h264enc = { git = "https://github.com/monomadic/filmcraft", rev = "3be5ba26da4578cc973eb8f0ab070df1bda9a1f6" }
filmcraft-prores = { git = "https://github.com/monomadic/filmcraft", rev = "3be5ba26da4578cc973eb8f0ab070df1bda9a1f6" }
filmcraft-aac = { git = "https://github.com/monomadic/filmcraft", rev = "3be5ba26da4578cc973eb8f0ab070df1bda9a1f6" }
rayon = "1"
resvg = { version = "0.45", default-features = false }

# AppKit, for two things (both in main.rs): the fake-fullscreen contour fix
# on macOS Tahoe (the ~1px window border is drawn with the shadow, so we
# need setHasShadow(false)), and the embedded Dock icon.
[target.'cfg(target_os = "macos")'.dependencies]
filmcraft-platform = { git = "https://github.com/monomadic/filmcraft", rev = "3be5ba26da4578cc973eb8f0ab070df1bda9a1f6" }
objc2-app-kit = { version = "0.2", features = [
    "NSResponder",
    "NSView",
    "NSWindow",
    "NSApplication",
    "NSImage",
] }
objc2-foundation = { version = "0.2", features = ["NSData"] }
# 0.5 to match objc2-app-kit 0.2's objc2 (only needed for the ClassType trait).
objc2 = "0.5"

# Compiles src/open_shim.m (the Open With delegate graft, see src/open.rs).
# `cc` is already in the dependency tree transitively, so this pulls in no
# new crate download.
[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[profile.dev]
# wgpu + shader-heavy code is unusably slow at opt-level 0
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# The .app bundle is built by packaging/build-app.sh (same recipe as
# switchblade: bundled ffmpeg dylibs, ad-hoc codesign), not cargo-bundle —
# cargo-bundle can't rewrite the dylib load paths, so its bundle only ran on
# the machine that built it.
