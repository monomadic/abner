# abner — default configuration.
#
# This file is compiled into the binary and is the complete configuration:
# every key abner reads is declared here, with its default. A user config
# is an OVERLAY on top of it — set only the keys you want to change, in the
# same tables. The first of these that exists is used (later ones are not
# read):
#
#   1. --config <path>           (an explicit path must exist)
#   2. ./abner.toml              (the working directory)
#   3. ~/.config/abner/abner.toml
#   4. ~/.config/abner.toml
#
# Unknown keys, wrong types and out-of-range values are errors: abner
# refuses to start and says which file and key.

[window]
# Initial window size in logical points (minimum 720×480).
width = 1280
height = 800

[playback]
# Starting view: overlay, sbs, delta, split, checker or blend.
# --view on the command line overrides it.
view = "overlay"
# Opened clips sit paused on their first frame (startup, drops, Open With).
start_paused = true
# Seconds jumped by ← / →.
seek_step = 1.0
# Decoded-frame cache per clip, in MB. Nearby frames are retained and
# farther frames evicted. On a cold long-GOP seek, distant pre-target frames
# are decoded without RGBA conversion; a nearby rewind window is retained.
# Seeks inside a cached span never touch the decoder. 1080p is ~8 MB a frame,
# 4K ~33 MB.
frame_cache_mb = 1024

[compare]
# Delta amplification (1–64; - / = adjust it live).
delta_gain = 4.0
# Blend mix, 0 = all A, 1 = all B.
blend = 0.5
# Checker square size in pixels (4–512).
checker_size = 48.0

[mask]
# Brush diameter in image pixels (1–4096; [ / ] adjust it live).
brush_size = 64.0

[processors]
# Memory budget for processor previews, in MB (64–65536). Plugins are fed the
# source at its NATIVE size; this bounds the paired before/after frames kept per
# preview section and the rendered frames retained across the timeline (a 1080p
# pair with a 2× output is ~41 MB a frame, 4K ~166 MB). It excludes the plugin's
# own model and session memory.
preview_cache_mb = 1024

[keys]
# A key name (tab, enter, space, backspace) or a single character.
# Flip to the next source video.
next_source = "tab"
# Show the current video alone, fullscreen: the workspace shell hides and
# the window goes fullscreen. Press again (or Esc) to come back.
fullscreen_video = "enter"
